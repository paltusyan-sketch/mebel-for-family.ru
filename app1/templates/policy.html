
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мебельный каталог</title>

    <!-- 1. ПОДКЛЮЧАЕМ TAILWIND (Стили) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. ПОДКЛЮЧАЕМ ALPINE.JS (Логика листалки) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-10">

    <!-- Твой блок с мебелью -->
    <div x-data="{ 
        index: 0, 
        images: [ {% for i in products %}'{{i.image.url}}',{% endfor %}],
        next() { this.index = (this.index + 1) % this.images.length },
        prev() { this.index = (this.index - 1 + this.images.length) % this.images.length }
    }" class="relative w-full max-w-2xl mx-auto shadow-2xl rounded-xl overflow-hidden bg-white p-4">

        <!-- Счётчик (по желанию) -->
        <div class="absolute top-6 left-6 z-10 bg-black/50 text-white px-2 py-1 rounded text-sm" x-text="(index + 1) + ' / ' + images.length"></div>

        <!-- Главное окно -->
        <div class="relative h-96 bg-gray-200 rounded-lg overflow-hidden">
            <img :src="images[index]" class="w-full h-full object-contain transition-all duration-500 ease-in-out">
            
            <!-- Стрелка влево -->
            <button @click="prev()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white p-3 rounded-full shadow-lg transition-transform active:scale-90">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>

            <!-- Стрелка вправо -->
            <button @click="next()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white p-3 rounded-full shadow-lg transition-transform active:scale-90">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- Миниатюры (точки-превью) -->
        <div class="flex justify-center gap-3 mt-6">
            <template x-for="(img, i) in images" :key="i">
                <div @click="index = i" 
                     :class="index === i ? 'ring-2 ring-blue-500 scale-110' : 'opacity-50 hover:opacity-100'"
                     class="w-16 h-12 cursor-pointer transition-all duration-200">
                    <img :src="img" class="w-full h-full object-cover rounded shadow">
                </div>
            </template>
        </div>
    </div>

</body>
</html>
