
services:
  redis:
    image: redis:7-alpine
    container_name: uralmeb_redis_local
    restart: always
    ports:
      - "127.0.0.1:6379:6379" # На локалке тоже зажимаем на всякий случай

  celery:
    build: ./backend # Собираем из твоего локального Dockerfile
    container_name: uralmeb_celery_local
    restart: always
    # Вместо 'config' подставим имя твоей папки со settings.py
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app # Прокидываем локальную папку с кодом и медиа транзитом
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
